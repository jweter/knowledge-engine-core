      file: ".github/workflows/m14-mass-discovery.yml"
      note: "path-filtered to pubmed_batch_discovery.py, pubmed_discovery.py, ncbi_http.py, and its own workflow file -- absent on most PRs, which is not a failure"
  advisory_review_unavailable_is_not_failure: true
  advisory_review_unavailable_example: "chatgpt-codex-connector[bot] posting a Codex-usage-limit notice is not a review finding"

