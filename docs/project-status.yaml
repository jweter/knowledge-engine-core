active_work:
  name: "Research-loop bottleneck instrumentation (issue #433) -- bounded-concurrency CORE and Unpaywall OA acquisition slice"
  tracking_issue: "#433 (jweter/knowledge-engine-core), companion to jweter/knowledge-engine-ai#84, refs #402"
  state: "final two item-4 provider slices implemented this session, PR opened, awaiting fresh CI"
  summary: "2026-09-03 (session continuation): PR #458 (bounded-concurrency Europe PMC OA downloads) had already merged to main. Per this file's own prior next_continuation note, the remaining item-4 sub-slice was applying the same bounded-ThreadPoolExecutor pattern to CORE and Unpaywall's acquisition services -- the last two of the four acquisition providers (PMC #457, Europe PMC #458 already done).
    `CoreOaAcquisitionService.acquire()` (knowledge_engine/core_acquisition.py) and `UnpaywallOaAcquisitionService.acquire()` (knowledge_engine/unpaywall_acquisition.py) each previously fetched every approved PDF sequentially in a plain for-loop. Both now mirror `EuropePmcOaAcquisitionService` exactly: a new keyword-only `max_concurrent_downloads: int = 4` constructor parameter (validated >= 1, rejects bool), a bounded `concurrent.futures.ThreadPoolExecutor` with a sliding submission window (`in_flight: dict[int, Future]`, at most `max_concurrent_downloads` requests in flight/holding a completed body at once, refilled only after the current body is fully consumed), and results consumed back in deterministic approval order -- so receipt/staging order, atomic rollback, and per-approval failure-ordinal error messages (`CORE PDF request failed for approval N.`, `Unpaywall-resolved PDF request failed for approval N.`) are byte-for-byte unchanged; only multi-PDF batch wall-clock time improves. The per-request network call was extracted into a `_get_pdf` helper on each class, callable from the thread pool, with the exact pre-existing error wording preserved verbatim.
    Neither service had its own low-level test file (unlike PMC/Europe PMC's separate test_pmc_acquisition.py/test_europepmc_acquisition.py) -- their `acquire()` methods are exercised directly inside tests/test_general_question_core_acquisition.py and tests/test_unpaywall_gqr_acquisition.py alongside the higher-level GQR bridge tests, so no test file needed a FakeTransport call-order-to-URL-keyed conversion (the existing single-approval fakes were already URL-independent). Added two new tests to each file mirroring the Europe PMC precedent: `test_core_downloads_run_concurrently_up_to_the_bound` / `test_unpaywall_downloads_run_concurrently_up_to_the_bound` (2-party `threading.Barrier` proving genuine concurrency across two distinct approvals, not just an API surface check, with deterministic receipt ordering asserted) and `test_core_max_concurrent_downloads_must_be_at_least_one` / `test_unpaywall_max_concurrent_downloads_must_be_at_least_one` (constructor validation, rejects 0 and bool True). All 9 pre-existing tests in each file continue to pass unchanged. 20 tests total across both files, all passing.
    Verification this session: `poetry install` (fresh venv, Python 3.13), `poetry run ruff format --check .` (585 files), `poetry run ruff check .`, and `poetry run mypy knowledge_engine tests` (372 files, matching the CI workflow's exact `mypy knowledge_engine tests` invocation) are all clean. `poetry run pytest` (full suite) is clean except the same two pre-existing, unrelated failures this file has documented across multiple prior sessions (test_evidence_map_report.py::test_cli_refuses_invalid_map_and_existing_output, test_statistical_verification.py::test_cli_rejects_invalid_input_and_protects_outputs -- Typer/Click output-format mismatch, unrelated to this change). The opened PR's own fresh CI is still the actual merge gate; do not merge on the strength of this local run alone.
    This closes issue #433 item 4's within-provider bounded-concurrency work for all four acquisition providers (PMC, Europe PMC, CORE, Unpaywall). Not done -- explicitly remaining on #433 item 4: cross-provider (as opposed to within-provider) concurrent scheduling -- e.g. running the PMC/Europe PMC/CORE/Unpaywall acquisition passes themselves concurrently rather than sequentially one provider at a time -- is not attempted. Item 2's remainder (retry-attempt count, cache/reuse-hit flag) remains fully unstarted, as does item 5 (grounded extraction/promotion timing) and item 6's remainder."

next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "Verify this session's PR (bounded-concurrency CORE and Unpaywall OA downloads, issue #433 item 4) has fresh green CI and merge it first if not already merged. With that merged, issue #433 item 4's within-provider bounded-concurrency work is complete for all four acquisition providers; the only remaining item-4 scope is cross-provider concurrent scheduling (running the PMC/Europe PMC/CORE/Unpaywall acquisition passes concurrently with each other, not just within each provider's own download step) -- treat that as a new, separately-scoped design decision (it changes the acquisition orchestration shape, not just one provider's internal loop), not a trivial continuation of this pattern. Item 2's remainder (retry-attempt count, cache/reuse-hit flag) first requires adding real retry/caching behavior to the FRD federated adapters (semantic_scholar_provider.py, openalex_provider.py, arxiv_provider.py, pubmed_federated_adapter.py, crossref_federated_adapter.py currently make exactly one attempt each) -- treat that as a bigger, separately-scoped slice, not a quick wiring fix. Item 5 (grounded extraction/promotion time/count instrumentation) is also still fully unstarted and may be a higher-value next slice than cross-provider concurrency. Separately: knowledge-engine-web/knowledge-engine-ai's Research Report v1 milestone remains blocked purely on deployment/paid-service decisions (attached persistent disk, reachable hosted inference) per docs/research_runtime_surface.md's 'Next slice' section -- do not treat this as an AI/Web code defect to fix autonomously; it needs a human infrastructure/paid-service decision. If #433 is later fully addressed on Core's side, re-read docs/roadmap.md's 'Current Project Path' section fresh for the next P5 slice."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md."

