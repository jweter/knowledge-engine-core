active_work:
  name: "Research-loop bottleneck instrumentation (issue #433) -- item 2 second slice: OpenAlex retry/rate-limit tracking"
  tracking_issue: "#433 (jweter/knowledge-engine-core), companion to jweter/knowledge-engine-ai#84, refs #402"
  state: "implemented this session, PR opened, awaiting fresh CI"
  latest_summary: "2026-09-03 (later hourly run): PR #461 (item 2's Semantic Scholar first slice, including the Codex-fixup commit) was already merged to main at the start of this session -- confirmed via `git log` and per-PR `pull_request_read`. Following this repository's own next_continuation note below, this session applied the identical retry/rate-limit pattern to the second of the four remaining single-attempt federated adapters: `openalex_provider.py`. `OpenAlexProvider` gains the same `max_attempts`/`retry_backoff_seconds`/`sleep` constructor parameters, `_RequestFailure`/`_RequestOutcome` types, and `_attempt`/`_raw_request` retry-loop structure already established by `semantic_scholar_provider.py`, retrying only HTTP 429 and provider-unavailable/connection-level failures with bounded exponential backoff (`max_attempts=3` default) -- never a non-transient 4xx, a 404 (still EMPTY), or a malformed/oversized response. `_success_result`/`_empty_result`/`_failure_result` now thread `retry_attempt_count`/`rate_limited_observed` from the retry loop into `ProviderStatus`; `_disabled_result` (missing-API-key, never attempted) is unchanged. No shared-infrastructure change was needed this time -- `ProviderStatus.__post_init__`'s outcome-derived `rate_limited_observed` and the ledger/coverage-report plumbing were already generalized across all adapters by PR #461's own Codex-fixup commit. New tests in `tests/test_openalex_provider.py`: rate-limit retried then succeeds, provider-unavailable retried to the bound then reported honestly, non-transient 404 never retried, first-attempt success reports zero retries, exponential backoff schedule (`SequenceTransport` helper mirroring the Semantic Scholar test file), constructor validation for `max_attempts`/`retry_backoff_seconds`; the existing `_provider()` test helper now defaults `max_attempts=1` and a no-op `sleep` so the pre-existing status-code/transport-failure parametrized tests keep testing outcome mapping rather than sleeping through real backoffs. `arxiv_provider.py` and `pubmed_federated_adapter.py`/`crossref_federated_adapter.py` remain untouched, single-attempt, and are the next two natural slices. Verification: `poetry install`, `poetry run ruff format --check .` / `ruff check .` on changed files, `poetry run mypy` on changed files, and the full `poetry run pytest` suite are all clean except the same two pre-existing, unrelated failures this file has documented across many prior sessions (test_evidence_map_report.py::test_cli_refuses_invalid_map_and_existing_output, test_statistical_verification.py::test_cli_rejects_invalid_input_and_protects_outputs -- Typer/Click output-format mismatch, unrelated to this change). The opened PR's own fresh CI is still the actual merge gate; do not merge on the strength of this local run alone."
  summary: "2026-09-03 (hourly run): issue #433's own previous next_continuation note (item 3's candidate-funnel count) was already merged (PR #460) at the start of this session -- confirmed via `git log --oneline -20` and the GitHub MCP `list_pull_requests` tool (zero open PRs). This session scoped down item 2 ('federated provider latency/degradation -- preserve per-provider elapsed time, retries/rate-limit state, result count, and cache/reuse status') to a small, safe first slice, following this repo's own established per-adapter precedent from item 4's PMC/Europe PMC/CORE/Unpaywall sequence (PRs #457-#459): implement bounded retry-with-backoff for exactly ONE federated discovery provider adapter, not all five. `semantic_scholar_provider.py` was picked as the highest-value first slice -- it is the default provider for both `ke federated-discover` and `ke citation-snowball` (FRD-7 note). `SemanticScholarProvider` now retries only genuinely transient failures (HTTP 429 rate-limiting, provider-unavailable/connection-level errors) with a bounded exponential backoff (`max_attempts=3` by default, injectable `sleep`/`retry_backoff_seconds` for tests and tuning) -- never a non-transient 4xx client error, a legitimate not-found, an oversized response, or a malformed body. `ProviderStatus` (federated_discovery.py) gains `retry_attempt_count` (retries actually needed, `0` if the first attempt succeeded or failed non-transiently) and `rate_limited_observed` (whether any attempt saw a 429, even if a later retry succeeded); an unattempted (SKIPPED/DISABLED) provider is rejected by `__post_init__` if it reports either, preventing a fabricated retry count. `ProviderCoverageRecord` (federated_search_ledger.py) persists both per-provider with the same additive, no-schema-version-bump pattern `raw_observation_count` used in PR #460: a run recorded before these fields existed simply omits the keys, and the loader defaults them to `0`/`False`. `SearchCoverageReport` gains the derived `total_retry_attempts` (sum across attempted providers, mirroring `raw_observation_count`'s attempted-only contract) and `providers_rate_limited` (names of attempted providers that saw a 429), both computed at read time from already-persisted facts -- no backfill needed. `build_public_federated_result_payload`'s provenance mismatch guard was extended to reconcile `total_retry_attempts` the same way it already reconciled `raw_observation_count`. Exposed through `ke federated-coverage-report` (new console `Retries:` line, new `Rate limited` provider-coverage-table column, `--output` JSON) and `ke federated-discover --output`. The other four federated adapters -- `openalex_provider.py` (FRD-2), `arxiv_provider.py` (FRD-4), `pubmed_federated_adapter.py`, `crossref_federated_adapter.py` (FRD-5) -- are deliberately untouched and remain single-attempt, reporting `retry_attempt_count=0`/`rate_limited_observed=False` always; each is a natural, independently reviewable next slice, exactly like item 4's own per-provider sequence. New/updated tests: `tests/test_semantic_scholar_provider.py` (rate-limit retried then succeeds, provider-unavailable retried to the bound then reported honestly, non-transient 404 never retried, first-attempt success reports zero retries, exponential backoff schedule, constructor validation) plus updated existing status-code/transport-failure tests to pass `max_attempts=1` (they test outcome mapping, not the retry loop, and this keeps them fast/deterministic rather than sleeping through real backoffs); `tests/test_semantic_scholar_citation_traversal.py` (same `max_attempts=1` fix for its one 429 test); `tests/test_federated_discovery.py` (ProviderStatus invariants: rejects retries/rate-limit on an unattempted provider, rejects negative retry_attempt_count, defaults to the no-retry state); `tests/test_federated_search_ledger.py` (retry/rate-limit facts round-trip through record+coverage_report, a skipped provider never reports a fabricated retry count, pre-existing ledger records missing the new keys load with 0/False defaults); `tests/test_federated_coverage_provenance.py` and `tests/test_federated_result_snapshot.py` (updated exact-dict-shape assertions for the two new `SearchCoverageReport` fields, new provenance-mismatch case for `total_retry_attempts`). Verification this session: `poetry install`, `poetry run ruff format --check .`, `poetry run ruff check .`, and `poetry run mypy knowledge_engine tests` are all clean; `poetry run pytest` (full suite) is clean except the same two pre-existing, unrelated failures this file has documented across multiple prior sessions (test_evidence_map_report.py::test_cli_refuses_invalid_map_and_existing_output, test_statistical_verification.py::test_cli_rejects_invalid_input_and_protects_outputs -- Typer/Click output-format mismatch). The opened PR's own fresh CI is still the actual merge gate; do not merge on the strength of this local run alone.

    Follow-up (same 2026-09-03 session, second commit on the same PR): the `chatgpt-codex-connector[bot]` review left 4 findings, all verified real and fixed. (1) P1 -- `rate_limited_observed` was only ever set `True` by the new Semantic Scholar retry loop's own bookkeeping, so the other four adapters' pre-existing `ProviderOutcome.RATE_LIMITED` outcome (openalex/arxiv/pubmed/crossref, all untouched by this PR) persisted/reported `rate_limited_observed=False` -- a direct self-contradiction. Fixed generally, not per-adapter: `ProviderStatus.__post_init__` (federated_discovery.py) now derives `rate_limited_observed=True` whenever `outcome == RATE_LIMITED`, regardless of which adapter produced it, and `ProviderCoverageRecord.__post_init__` (federated_search_ledger.py) mirrors the same derivation for the persisted-record shape. (2) P1 -- `CitationSnowballLedger.record()` (citation_snowball_ledger.py, used by `ke citation-snowball`, default provider Semantic Scholar) copied outcome/attempted/result_count/reason from each traversal's `ProviderStatus` into `CitationTraversalRecord` but dropped the two new retry fields entirely, silently discarding retry/rate-limit provenance the moment a run was persisted. `CitationTraversalRecord` now carries `retry_attempt_count`/`rate_limited_observed` (additive, `LEDGER_SCHEMA_VERSION` unchanged at 1; old records missing the keys default to `0`/`False`, corrected to `True` for `rate_limited_observed` via the same outcome-derivation `__post_init__` when a record's own outcome is `rate_limited`), and both `ke citation-snowball --output` (new `traversals` array) and `ke citation-snowball-report`'s Traversals console table (new Retries/Rate limited columns) now surface them. (3) P2 -- `ke federated-coverage-report`'s console `Retries:` line labeled `total_retry_attempts` as \"total attempt(s)\", but the field counts retries only (excludes each provider's initial request), understating real request count; relabeled to \"retry attempt(s)\" (entrypoint.py ~line 6334). Checked every other surface of this field (docs/core_interface_contract.md, CHANGELOG.md, docstrings, other tests) -- all already correctly describe it as a retry/sum-of-retries count, so this was the only mislabeled site. (4) P2 -- the ledger loader's `_provider_from_payload` (federated_search_ledger.py) defaulted a missing `rate_limited_observed` key to `False` unconditionally, so a pre-PR-461 persisted record whose own `outcome` field already said `\"rate_limited\"` loaded as `rate_limited_observed=False` -- fabricating an absence of rate-limiting the record's own outcome contradicted. Fixed by the same `ProviderCoverageRecord.__post_init__` derivation used for finding 1 (forward construction and backward-compatible loading now share one derivation site per record type, as the finding suggested where practical). Added regression tests for all four (non-Semantic-Scholar adapter RATE_LIMITED -> rate_limited_observed=True; citation-snowball retry/rate-limit facts survive persistence and CLI JSON/console; the console relabel; old-format ledger record with outcome=rate_limited and no rate_limited_observed key loads True). Verification: `poetry run ruff format --check .`, `poetry run ruff check .`, `poetry run mypy knowledge_engine tests`, and `poetry run pytest` (full suite) all clean except the same two pre-existing, unrelated failures documented above. Pushed as a new commit to the existing `claude/gracious-goldberg-0rqgtq` branch (no rebase/amend/force-push); PR #461's fresh CI on this new head is still the actual merge gate."

