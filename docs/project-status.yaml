next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "This session opened a PR wiring Crossref's `update-to` relation to populate `ProviderObservation`'s `retracted`/`corrected`/`expression_of_concern`/`withdrawn` flags for Crossref-sourced FRD candidates (see the FRD-5_dedup_disagreement entry above) -- purely additive (new optional `PublicationStatusSignal` type and `MetadataProviderResult.publication_status` field, `ke metadata-preview` unaffected, no schema_version bump). This was the concrete follow-up the prior session's own continuation note named as a reasonable next slice, evaluated against the actual code (crossref.py/crossref_federated_adapter.py/metadata_enrichment.py) before implementing, and kept deliberately narrow: only types with an unambiguous mapping are recognized, and a flag is only ever set `True`, never an inferred `False`, given Crossref's crossmark participation is not universal. Remaining, not yet scoped: (1) a second provider's correction/retraction signal (e.g. a future PubMed `CommentsCorrectionsList` parse -- no such XML element is parsed anywhere in this repository today, a materially bigger and riskier slice than the Crossref case); (2) `knowledge-engine-ai`'s `ke_client`/`FederatedCandidateSummary` parsing layer for these fields, now working against real (Crossref-sourced) data rather than only a schema gap; (3) `knowledge-engine-web`'s `PublicationStatusView` rendering for them -- (2) and (3) are out of scope for this repo. FRD-8 (optional MCP facade) remains deliberately deferred; there is no other currently-authorized FRD-# slice. Re-read docs/roadmap.md for the next milestone worth starting once FRD-8 is settled."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md."

human_decision_required: null

