active_work:
  name: "Research-loop bottleneck instrumentation (issue #433) -- embedding-generator readiness timing slice"
  tracking_issue: "#433 (jweter/knowledge-engine-core), companion to jweter/knowledge-engine-ai#84, refs #402"
  state: "one slice implemented this session, PR opened, awaiting fresh CI"
  summary: "2026-09-02 (hourly run): verified this file's own next_continuation note against live GitHub state first -- PR #455 (ke process-startup-timing, item 1's process/database-startup half) had already merged to main (merge commit visible via GitHub; local main fast-forwarded to it) since this file was last updated, and knowledge-engine-core had zero other open PRs. Picked item 1's remaining half per that same next_continuation note: item 1a, vector-search's sentence-transformers embedding-model load timing.
    Extended the existing `ke process-startup-timing` probe rather than adding a new command, since PR #455's own body named this exact command as where the deferred half belonged: `ProcessStartupTiming` gained two new optional fields (`embedding_generator_ready_ms`, `embedding_generator_model_id`, both default `None`) and `measure_process_startup_timing()` gained an optional `build_embedding_generator` callable parameter. When given, the built generator's `dimension` property is read to force a lazy-loading generator (`SentenceTransformerEmbeddingGenerator`) to actually load its model weights, timed independently of the import/database costs; `OpenAiEmbeddingGenerator.dimension` is a fixed local lookup, so requesting `--generator openai` reports a near-zero cost by design, not by omission -- documented as such rather than left to look like a bug. New CLI options `--generator local|openai` and `--model <name>` on `ke process-startup-timing`, wired through the existing `_build_embedding_generator` helper (the same one `ke vector-search`/`ke embedding-generate` already use) for consistency and reuse rather than a second construction path. Opt-in (`--generator` omitted by default): unlike process/database startup, not every invocation pays this cost, and measuring it has a real cost of its own (a local model's weights, or a required `KE_OPENAI_API_KEY`). `--model` without `--generator` is rejected with a plain console error, matching this codebase's existing validation style (`ke vector-search`'s `--generator`/`--model`-only-with-`--query-text` check).
    New tests: tests/test_process_startup_timing.py gained a `_FakeEmbeddingGenerator` double (no real model load or network call) and three cases (timing is None when not requested; timing is measured and `dimension` was actually read exactly once when requested; to_dict/to_json round-trip includes the two new keys). tests/test_process_startup_timing_cli.py gained a CLI-level `_FakeEmbeddingGenerator` and four cases (timing omitted from console/JSON by default; `--generator local --model custom-model` measured end-to-end via a monkeypatched `entrypoint._build_embedding_generator` -- this repo's existing pattern for exercising the local-generator CLI path without a real download, see test_free_text_vector_search_cli.py's own `_FakeGenerator` -- confirming it is called with `(\"local\", \"custom-model\")`; `--model` without `--generator` rejected).
    Verification this session: `poetry install` (fresh venv picked up sentence-transformers/torch), `poetry run ruff format --check .`, `poetry run ruff check .`, and `poetry run mypy knowledge_engine tests` (372 source files) are all clean. `poetry run pytest` (full suite) is clean except the same two pre-existing, unrelated failures this file has documented across multiple prior sessions (test_evidence_map_report.py::test_cli_refuses_invalid_map_and_existing_output, test_statistical_verification.py::test_cli_rejects_invalid_input_and_protects_outputs -- Typer/Click output-format mismatch, unrelated to this change). The opened PR's own fresh CI is still the actual merge gate; do not merge on the strength of this local run alone.
    This closes issue #433 item 1 in full (both the process/database-startup half from PR #455 and the embedding-generator-readiness half from this session's PR). Not done -- explicitly remaining on #433: (2. remainder) a real retry-attempt count and cache/reuse-hit flag on ProviderStatus (requires adding actual retry/caching behavior to the FRD adapters first -- none of the five currently retry -- then coordinating the new fields cross-repo), (4) bounded-concurrency acquisition throughput, fully unstarted."

next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "Verify this session's PR (ke process-startup-timing --generator, issue #433 item 1a) has fresh green CI and merge it first if not already merged. Then issue #433 item 4 (bounded-concurrency acquisition throughput) is the only fully-unstarted item left and is the natural next slice. Item 2's remainder (retry-attempt count, cache/reuse-hit flag) first requires adding real retry/caching behavior to the FRD federated adapters (semantic_scholar_provider.py, openalex_provider.py, arxiv_provider.py, pubmed_federated_adapter.py, crossref_federated_adapter.py currently make exactly one attempt each) -- treat that as a bigger, separately-scoped slice, not a quick wiring fix. If #433 is later fully addressed on Core's side, re-read docs/roadmap.md's 'Current Project Path' section fresh for the next P5 slice."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md."

