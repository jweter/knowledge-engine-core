  action: "2026-08-23 (later session): closed CORE-GQR-2's remaining PMID/arXiv identity gap that the prior 2026-08-23 session's next_continuation item (3) named -- see current_milestone.updated_this_session above and docs/general_question_research_loop_v1.md's CORE-GQR-2 section for the full account. Opened as a DRAFT PR per explicit external one-shot instructions for this run (not this repository's own 'draft_prs: never' automation_contract convention -- flagged here, same as the prior session's PR, so a future session does not treat the draft state itself as a policy violation to fix). Cross-repo check performed: grepped knowledge-engine-ai and knowledge-engine-web for any reference to general_question_acquisition/AcquisitionDisposition/GeneralQuestionAcquisitionRequest/papers.pmid/papers.arxiv_id -- none found, so this change has no existing cross-repo consumer and cannot be a breaking contract change; it is also schema-additive (new nullable columns, existing schema_version bump follows the established v6/v7/v11/v12 pattern) so upgrading an existing local database is safe. Next continuation, in dependency order: (1) wire a real ingestion-time caller so `papers.pmid`/`papers.arxiv_id` actually get populated for newly imported papers (mirroring how `manifest_doi` already flows into `papers.doi` via `PaperRepository._build_paper`/`add_parsed_paper`), and consider a backfill for already-persisted papers -- without this, the PMID/arXiv reuse detection added this session has no real data to match against outside tests; (2) no real caller yet passes a live database session into build_acquisition_plan() at all -- that naturally arrives together with CORE-GQR-3 (route eligible ELIGIBLE_FULL_TEXT items through the existing PMC OA / Europe PMC OA / CORE / Unpaywall acquisition services) and CORE-GQR-4 (persist newly acquired sources, attach acquisition-receipt provenance, parse); (3) PMCID-based already-indexed detection remains blocked on Paper not persisting a PMCID column at all -- a small schema addition would be needed first if that reuse gap matters before CORE-GQR-4 lands. (4) Separately, the retrieval-benchmark continuation recorded by an earlier session (rerun knowledge-engine-ai's cross-domain Research Copilot evaluator against the reviewed schema-v2 benchmark once a working local Ollama/LLM setup and the full corpora are available) remains open and was not attempted this session either, for the same infrastructure-availability reason."
