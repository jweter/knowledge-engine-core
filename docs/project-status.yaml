  priority: "P5-highest-value-authorized-roadmap"
  action: "CORE-GQR-4's four provider execution adapters are all implemented for the success path, but one explicit roadmap requirement remains open: 'keep failures independently inspectable'. Add a durable, per-candidate failure/rejection record (e.g. persisted alongside or instead of today's console-print-and-rollback-only behavior) to general-question-acquire-pmc/europe-pmc/core/unpaywall so a resolver/download/parsing failure leaves an auditable, retryable trace rather than only stderr output. Only once that lands is CORE-GQR-4 complete and CORE-GQR-5 (grounded extraction and promotion: invoke the existing domain-general grounded-extraction/source-verification component against a persistence receipt's parsed text, verify proposed fields against source spans, validate against the Evidence Record schema, append/promote only valid records, persist rejection reasons for failed proposals) the correct next slice. Do not begin CORE-GQR-6 until CORE-GQR-5 is complete or the roadmap explicitly changes."
