product:
  primary_surface: "CLI (`ke`) -- the only supported interface; no HTTP API, no importable knowledge_engine package for other processes"
  role_in_family: "hub of the three-repository Knowledge Engine family (core, web, ai)"
  mission: "Open scientific knowledge platform: reproducible ingestion, source-linked evidence, honest coverage of what was and was not searched"

current_milestone:
  name: "General Question Research Loop v1 (GQR) - Core acquisition bridge"
  roadmap_file: "docs/general_question_research_loop_v1.md"
  tracking_issue: "#402 (jweter/knowledge-engine-core), parent AI issue jweter/knowledge-engine-ai#69"
  state: "active"
  objective: "Turn persisted federated-discovery leads into bounded, auditable, reusable Evidence Records (query -> candidates -> acquisition -> ingestion -> extraction -> promotion) without weakening provenance, access, or grounding rules. This supersedes the now-foundational FRD sequence below as the current milestone: FRD-1..7 are complete/reachable infrastructure that GQR's Stage 3 (bounded federated discovery) consumes, not separate ongoing work."
  updated_this_session: "2026-08-27: verified PR #420 merged the validation-gated CORE execution/persistence library on exact head 5018421a. The current slice exposes that merged executor through the supported `ke general-question-acquire-core` command surface while preserving the existing PMC/Europe PMC commands; exact-head Quality, Bandit, and pip-audit remain required before this CLI slice may merge."
  gqr_sub_milestone_status:
    CORE-GQR-1_schema: "implemented and merged (PR #404): GeneralQuestionAcquisitionRequest/GeneralQuestionAcquisitionPlan, stable JSON serialization, schema-version validation, persisted search-run candidate resolution via build_acquisition_plan()."
    CORE-GQR-2_identity_and_reuse: "DOI/PMID/arXiv-based already-indexed detection all implemented; schema version 13 added the two new persisted, uniquely indexed `papers` columns. `CorpusIngestionService`/`LinkedCorpusIngestionService` populate `papers.pmid`/`papers.arxiv_id` for newly imported papers from `sources.csv`'s existing `pmid`/`arxiv_id` columns (schema version 14 added `import_items.normalized_pmid`/`.normalized_arxiv_id`). `ke general-question-acquisition-plan` passes a real database session into `build_acquisition_plan()` by default (`--no-database` to opt out). Not yet done: no backfill for already-persisted pre-existing papers, and PMCID has no persisted column."
    CORE-GQR-3_acquisition_routing: "implemented and merged (PR #414): eligible_full_text items name a stable pmc_oa/europe_pmc_oa/core/unpaywall route; official-host checks gate PMC, Europe PMC, and CORE, and unsupported direct URLs degrade to metadata_only."
    CORE-GQR-4_persist_and_parse: "PMC and Europe PMC execution paths are complete and reachable. The CORE provider library merged in PR #420: exact DOIs are re-resolved, `core.ac.uk` URLs are reconciled, explicit reusable-license evidence is mandatory, downloads are bounded/atomic, bytes are integrity-checked, Papers are persisted/reused, and ImportRun/ImportItem lineage is retained. The current branch makes that executor reachable through `ke general-question-acquire-core`; this reachability change is pending fresh exact-head CI. Unpaywall is the remaining provider execution adapter after this slice."
    CORE-GQR-5_extraction_and_promotion: "not started."
    CORE-GQR-6_reuse_and_query_visibility: "not started."
  predecessor_milestone_frd_sequence:
    name: "FRD (Federated Research Discovery) adoption sequence"
    roadmap_file: "docs/roadmap/federated_research_discovery_adoption.md"
    state: "foundational infrastructure, effectively complete for GQR's purposes (FRD-8 deliberately deferred, not blocking)"
    objective: "Fan discovery queries across scholarly providers (PubMed, Crossref, OpenAlex, Semantic Scholar, arXiv) behind one recorded, deduplicated, reproducible search run, and expose that provenance to knowledge-engine-web/knowledge-engine-ai."
    sub_milestone_status:
      FRD-1_contract: "implemented and reachable"
      FRD-2_openalex: "search implemented and live-verified; citation retrieval reachable via `ke citation-snowball --provider openalex` (FRD-7)."
      FRD-3_semantic_scholar: "search implemented and live-verified; citation traversal reachable via `ke citation-snowball` (default provider, FRD-7)."
      FRD-4_arxiv: "implemented and live-verified"
      FRD-5_dedup_disagreement: "implemented and reachable via `ke federated-discover --output`; provider-neutral publication-status signals and persisted candidate snapshots are available to downstream Web/AI callers."
      FRD-6_ledger_coverage: "implemented and reachable via `ke federated-discover` / `ke federated-coverage-report` / `ke federated-discover-history`; persisted runs retain deduplicated candidate snapshots when available."
      FRD-7_citation_snowball: "reachable for both Semantic Scholar (default) and OpenAlex via `ke citation-snowball --provider <semantic_scholar|openalex>` / `ke citation-snowball-report`."
      FRD-8_mcp_facade: "deliberately deferred; not started"

