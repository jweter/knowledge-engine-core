current_milestone:
  name: "General Question Research Loop v1 (GQR) - Core acquisition bridge"
  roadmap_file: "docs/general_question_research_loop_v1.md"
  tracking_issue: "#402 (jweter/knowledge-engine-core), parent AI issue jweter/knowledge-engine-ai#69"
  state: "core_portion_complete"
  objective: "Turn persisted federated-discovery leads into bounded, auditable, reusable Evidence Records (query -> candidates -> acquisition -> ingestion -> extraction -> promotion) without weakening provenance, access, or grounding rules. This supersedes the now-foundational FRD sequence below as the current milestone: FRD-1..7 are complete/reachable infrastructure that GQR's Stage 3 (bounded federated discovery) consumes, not separate ongoing work."
  updated_this_session: "2026-08-30 (hourly run, implementation): closed CORE-GQR-6, completing Core's portion of GQR v1 per the roadmap doc's Definition of done. Two of the three CORE-GQR-6 bullets needed no new code, only documentation: (1) visibility -- a promoted record's source_doi (set from paper.doi in extraction/evidence_items.py) already lets ke evidence-report/ke evidence-map-report join it by DOI, so the documented refresh step is simply passing the same --evidence <path> used for promotion; (2) repeat-question no-duplicate-acquisition is already proven by CORE-GQR-2's already-indexed-candidate tests (planning stage) and CORE-GQR-5's test_rerunning_the_same_receipt_is_idempotent (promotion stage). The one real gap -- corpus-library export/import silently leaving newly acquired evidence behind, since evidence_records.jsonl lives outside the SQLite database entirely -- is now closed: knowledge_engine/corpus_library.py gained an optional evidence_path (export)/evidence_output_path (import) parameter and a snapshot-only evidence_records_snapshot table (its own MetaData, not part of models.Base, since EvidenceRecords are still never rows in the live application's schema -- see the table's own docstring); import merges by evidence_record_id exactly like _promote_evidence_records's own append-only dedup contract. `ke corpus-library-export --output <path> --evidence <path>` / `ke corpus-library-import --input <path> --evidence <path>` (new optional --evidence on both, entrypoint.py); omitting it behaves exactly as before this change. New tests: 10 cases added to tests/test_corpus_library.py (export counts/skips-malformed evidence, import merges/dedupes/no-op-on-missing-table, compressed round trip) and 1 CLI round-trip case in tests/test_corpus_library_cli.py. Full local gate (ruff format/check, mypy, pytest) is clean except the same two pre-existing unrelated failures noted by prior sessions (test_evidence_map_report.py, test_statistical_verification.py -- Typer/Click output-format mismatch, unrelated to this change). This completes Core's portion of GQR v1; knowledge-engine-web/knowledge-engine-ai's own GQR-surfacing follow-up work is tracked in their own repositories, not here."
  gqr_sub_milestone_status:
    CORE-GQR-1_schema: "implemented and merged (PR #404): GeneralQuestionAcquisitionRequest/GeneralQuestionAcquisitionPlan, stable JSON serialization, schema-version validation, persisted search-run candidate resolution via build_acquisition_plan()."
    CORE-GQR-2_identity_and_reuse: "DOI/PMID/arXiv-based already-indexed detection all implemented; schema version 13 added the two new persisted, uniquely indexed `papers` columns. This session closed the remaining ingestion-time gap: `CorpusIngestionService`/`LinkedCorpusIngestionService` (the real corpus-manifest ingestion path behind `ke corpus-import`) now populate `papers.pmid`/`papers.arxiv_id` for newly imported papers from `sources.csv`'s existing `pmid`/`arxiv_id` columns (schema version 14 added the `import_items.normalized_pmid`/`.normalized_arxiv_id` carrier columns this needed). `ke general-question-acquisition-plan` already passes a real database session into `build_acquisition_plan()` by default (`--no-database` to opt out) -- this was already true before this session; a prior version of this status line incorrectly said otherwise. Not yet done: no backfill for already-persisted (pre-existing) papers, and PMCID has no persisted column at all."
    CORE-GQR-3_acquisition_routing: "implemented and merged (PR #414): eligible_full_text items name a stable pmc_oa/europe_pmc_oa/core/unpaywall route; official-host checks gate PMC, Europe PMC, and CORE, and unsupported direct URLs degrade to metadata_only."
    CORE-GQR-4_persist_and_parse: "complete. All four provider routes (PMC, Europe PMC, CORE, Unpaywall) are implemented, reachable through the `ke` command surface, and covered by dedicated tests for the success path. PMC/Europe PMC/CORE merged via PR #414/#420 (exact DOIs re-resolved, official hosts reconciled, explicit reusable-license evidence mandatory, downloads bounded/atomic, bytes integrity-checked, Papers persisted/reused, ImportRun/ImportItem lineage retained). Unpaywall merged via PR #422 (2026-08-27): `ke general-question-acquire-unpaywall` re-resolves every planned DOI through Unpaywall's live per-DOI API, requires current `is_oa=true` plus a reusable license, admits direct PDF bytes only from Core's existing reviewed full-text host set (never treating Unpaywall itself as a full-text host), and carries the same atomic/receipted/ImportRun-ImportItem persistence contract as the other three routes. See docs/security/unpaywall_gqr_acquisition_boundary.md for the fail-closed security boundary. This session closed the remaining gap: a resolver/download/parsing failure on any route now writes a durable, sanitized `GeneralQuestionAcquisitionFailureRecord` (new `knowledge_engine/general_question_acquisition_failures.py`) to `<receipt-path>.failure.json` before the existing console-print-and-rollback and non-zero exit -- wired into `entrypoint.py`'s production `general_question_acquire_pmc`/`_europe_pmc`, `command_surface.py`'s `_core`/`_unpaywall`, and `research_acquisition_surface.py`'s `ke-research`-slim PMC/Europe PMC duplicates. A stale failure record is cleared on a later successful retry at the same receipt path. CORE-GQR-4's 'keep failures independently inspectable' requirement is now met for all four routes; CORE-GQR-5 is the correct next slice."
    CORE-GQR-5_extraction_and_promotion: "complete. `ke general-question-extract-and-promote` (production and ke-research-slim) bridges a GQR persistence receipt to validated Evidence Records via the existing deterministic M17-M28 extraction pipeline, M52's autoclassifier, and cli.py's unmodified `_promote_evidence_records` validator; a paper/candidate that does not reach promotion gets a durable rejection reason at `<receipt-path>.extraction_rejections.json` (new `knowledge_engine/general_question_extraction_promotion.py`). Promoted records keep `review_status=\"draft\"` -- the separate `ke evidence-review-automate` LLM-grounded-PICO/`review_status=\"reviewed\"` step is unchanged, existing, distinct follow-up work, not part of this milestone."
    CORE-GQR-6_reuse_and_query_visibility: "complete. Visibility and repeat-question-dedup bullets were already satisfied by existing behavior/tests (see updated_this_session and docs/general_question_research_loop_v1.md); the corpus-library export/import evidence-preservation gap is closed by a new optional `--evidence <path>` on both `ke corpus-library-export` and `ke corpus-library-import` (`corpus_library.py`'s `evidence_records_snapshot` transport table, deduplicated by `evidence_record_id` on import). This was the last CORE-GQR-# sub-milestone; Core's portion of GQR v1 is complete."
