product:
  primary_surface: "CLI (`ke`) -- the only supported interface; no HTTP API, no importable knowledge_engine package for other processes"
  role_in_family: "hub of the three-repository Knowledge Engine family (core, web, ai)"
  mission: "Open scientific knowledge platform: reproducible ingestion, source-linked evidence, honest coverage of what was and was not searched"

current_milestone:
  name: "General Question Research Loop v1 (GQR) - Core acquisition bridge"
  roadmap_file: "docs/general_question_research_loop_v1.md"
  tracking_issue: "#402 (jweter/knowledge-engine-core), parent AI issue jweter/knowledge-engine-ai#69"
  state: "active"
  objective: "Turn persisted federated-discovery leads into bounded, auditable, reusable Evidence Records (query -> candidates -> acquisition -> ingestion -> extraction -> promotion) without weakening provenance, access, or grounding rules. This supersedes the now-foundational FRD sequence below as the current milestone: FRD-1..7 are complete/reachable infrastructure that GQR's Stage 3 (bounded federated discovery) consumes, not separate ongoing work."
  updated_this_session: "2026-08-23 (continuation session): closed the ingestion-time-caller gap CORE-GQR-2's prior session left open (see gqr_sub_milestone_status below). `sources.csv` already documented `pmid`/`arxiv_id` columns (docs/core_interface_contract.md) but `corpus/validation.py` never surfaced them past the raw CSV row; `CorpusSourceRow` gained `pmid`/`normalized_pmid`/`arxiv_id`/`normalized_arxiv_id` (normalized via the existing `normalize_pmid`/`normalize_arxiv_id`), `ImportItem` gained matching `normalized_pmid`/`normalized_arxiv_id` columns (schema version 14, `_migrate_schema_v14`, additive/nullable/non-uniquely-indexed -- unlike v13's unique `papers.pmid`/`.arxiv_id`, a PMID/arXiv ID repeating across manifest rows is not a database identity violation here), and `CorpusIngestionService`/`LinkedCorpusIngestionService` now pass `item.normalized_pmid`/`.normalized_arxiv_id` to `PaperRepository._build_paper` as `manifest_pmid`/`manifest_arxiv_id`, mirroring `manifest_doi`'s existing flow exactly. In the same edit, corrected a stale claim this file carried in CORE-GQR-2_identity_and_reuse below ('no CLI/API caller passes a real database session into build_acquisition_plan() yet'): `ke general-question-acquisition-plan` (entrypoint.py) already did, on by default, since the prior session -- docs/general_question_research_loop_v1.md's own CORE-GQR-2 section said so correctly; only this file's status line was wrong. 6 new tests added (2 corpus-manifest parsing, 2 corpus-import end-to-end, 1 schema-migration, plus the schema-version-literal bump in every existing v13/v14 assertion); full repository suite: 1998 passed, the same 2 pre-existing unrelated CLI --force-overwrite-message failures as every prior session (test_evidence_map_report.py::test_cli_refuses_invalid_map_and_existing_output, test_statistical_verification.py::test_cli_rejects_invalid_input_and_protects_outputs). ruff format --check, ruff check, mypy knowledge_engine tests, and bandit --severity-level high all pass clean; scripts/quality_preflight.py stops only at the same 2 pre-existing pytest failures. Not attempted: backfilling `papers.pmid`/`papers.arxiv_id` for already-persisted papers (same as `papers.doi` was never backfilled either)."
  gqr_sub_milestone_status:
    CORE-GQR-1_schema: "implemented and merged (PR #404): GeneralQuestionAcquisitionRequest/GeneralQuestionAcquisitionPlan, stable JSON serialization, schema-version validation, persisted search-run candidate resolution via build_acquisition_plan()."
    CORE-GQR-2_identity_and_reuse: "DOI/PMID/arXiv-based already-indexed detection all implemented; schema version 13 added the two new persisted, uniquely indexed `papers` columns. This session closed the remaining ingestion-time gap: `CorpusIngestionService`/`LinkedCorpusIngestionService` (the real corpus-manifest ingestion path behind `ke corpus-import`) now populate `papers.pmid`/`papers.arxiv_id` for newly imported papers from `sources.csv`'s existing `pmid`/`arxiv_id` columns (schema version 14 added the `import_items.normalized_pmid`/`.normalized_arxiv_id` carrier columns this needed). `ke general-question-acquisition-plan` already passes a real database session into `build_acquisition_plan()` by default (`--no-database` to opt out) -- this was already true before this session; a prior version of this status line incorrectly said otherwise. Not yet done: no backfill for already-persisted (pre-existing) papers, and PMCID has no persisted column at all."
    CORE-GQR-3_acquisition_routing: "not started -- routing eligible candidates through PMC OA / Europe PMC OA / CORE / Unpaywall acquisition mechanisms."
    CORE-GQR-4_persist_and_parse: "not started -- this is where acquired-candidate persistence gets its own real `Paper` rows and receipts; CORE-GQR-2's identity/reuse logic already has a real database session via the CLI (see CORE-GQR-2 above) and now has real ingestion-time PMID/arXiv data to match against for the manifest-import path."
    CORE-GQR-5_extraction_and_promotion: "not started."
    CORE-GQR-6_reuse_and_query_visibility: "not started."
  predecessor_milestone_frd_sequence:
    name: "FRD (Federated Research Discovery) adoption sequence"
    roadmap_file: "docs/roadmap/federated_research_discovery_adoption.md"
    state: "foundational infrastructure, effectively complete for GQR's purposes (FRD-8 deliberately deferred, not blocking)"
    objective: "Fan discovery queries across scholarly providers (PubMed, Crossref, OpenAlex, Semantic Scholar, arXiv) behind one recorded, deduplicated, reproducible search run, and expose that provenance to knowledge-engine-web/knowledge-engine-ai."
    sub_milestone_status:
      FRD-1_contract: "implemented and reachable"
      FRD-2_openalex: "search implemented and live-verified; citation retrieval reachable via `ke citation-snowball --provider openalex` (FRD-7, merged 2026-08-19). This session (2026-08-22) is a documentation-only correction: this line and the roadmap doc's own FRD-2 section previously said work lookup/citation retrieval was 'not built', which was stale -- FRD-7 already closed it days earlier and the FRD-2 section simply was not updated at the time."
      FRD-3_semantic_scholar: "search implemented and live-verified; citation traversal reachable via `ke citation-snowball` (default provider, FRD-7). This session (2026-08-22) is a documentation-only correction of the same staleness as FRD-2 above."
      FRD-4_arxiv: "implemented and live-verified"
      FRD-5_dedup_disagreement: "implemented and reachable via `ke federated-discover --output`. Earlier follow-up (merged): `ProviderObservation`/`CandidateObservationRecord` gained `corrected`/`expression_of_concern`/`withdrawn` optional boolean fields alongside the existing `retracted`, closing the concrete Core-side schema gap `knowledge-engine-web`'s WEB-FRD-4/WEB-FRD-5 sections named as blocking their remaining publication-status exit criteria. Purely additive (new optional fields default to `None`, `provider_disagreement.py`'s field-order tuple extended to match, ledger `schema_version` unchanged, pre-existing ledger records load the new fields as `None`). This session's follow-up (see PR): `crossref_federated_adapter.py` now populates all four flags from Crossref's `update-to` relation via new `crossref.parse_crossref_publication_status` -- a flag is only ever set `True` (never an inferred `False`) from a fixed, documented subset of Crossref's `update-to.type` vocabulary; unmapped types and an absent/empty `update-to` list leave every flag `None`. Carried through additive, provider-neutral `metadata_enrichment.PublicationStatusSignal`/`MetadataProviderResult.publication_status` (both optional, so `ke metadata-preview`'s unrelated Crossref-review path is unaffected). No other provider transport populates these three fields yet; OpenAlex's `is_retracted` remains the only other populated flag. `knowledge-engine-ai`'s parsing layer and `knowledge-engine-web`'s rendering for these fields remain that project's own future work, now unblocked by real (Crossref-sourced) data rather than only a schema gap."
      FRD-6_ledger_coverage: "implemented and reachable via `ke federated-discover` / `ke federated-coverage-report` / `ke federated-discover-history` (both prior follow-ups now merged to main). This session's follow-up (also merged): `FederatedSearchLedger.record` now persists each run's full deduplicated candidate list (not just `candidate_count`) on `SearchRunRecord.candidates`, and `ke federated-coverage-report --output` writes a specific past run's coverage plus that candidate snapshot as JSON -- the concrete Core ask `knowledge-engine-web`'s WEB-FRD-5 design doc section 9 named as its remaining unblock. Purely additive (new optional field, pre-existing records load with an empty candidate list, `schema_version` unchanged)."
      FRD-7_citation_snowball: "reachable for both Semantic Scholar (default) and OpenAlex via `ke citation-snowball --provider <semantic_scholar|openalex>` / `ke citation-snowball-report` (OpenAlex wiring this session, unmerged -- see PR). --provider defaults to semantic_scholar, so this is additive and does not change any existing caller's behavior."
      FRD-8_mcp_facade: "deliberately deferred; not started"

