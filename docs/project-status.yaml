active_work:
  name: "Research Report v1 Core support (issue #449) -- structured-field slices: confidence_interval (done), duration (this session)"
  tracking_issue: "#449 (jweter/knowledge-engine-core), refs #402, jweter/knowledge-engine-ai#129, jweter/knowledge-engine-web#107"
  state: "duration slice merged (PR #476, then a post-merge P1 fix via PR #478 -- see follow-up note below); dose, measurement_method, effect_size remain"
  latest_summary_2026_09_04_eighth_session: "This hourly run's own light triage found zero open PRs across all three Knowledge Engine repositories. Per this file's own next_continuation note, picked issue #449's next remaining structured-field slice: `duration` (study/intervention/follow-up duration), following the exact `confidence_interval` (M74) template -- new `knowledge_engine/extraction/duration.py` (`extract_duration`, `DURATION_EXTRACTION_RULES_VERSION = \"m75-duration-v1\"`) matches a duration mention in one claim candidate's own sentence and returns that sentence unchanged, never a parsed number/unit. Before finalizing the pattern, grepped all three checked-in corpora's `evidence_records.jsonl` files (~1,900 claim/result sentences across glp1_weight_loss, mental_health_mdd_antidepressants, oncology_nsclc_checkpoint_inhibitors) for real duration phrasings, then iteratively re-ran the candidate pattern against the full corpus and manually reviewed every match, the same due-diligence pass M74's Codex-review follow-up used. A naive \"number + day/week/month/year unit\" match was confirmed to be dominated by false positives that would be fabricated/misleading metadata if labeled `duration`: bare ages (\"the median age was 69 years\", \"65-year-old\", \"aged >=65 years\"); fixed survival/response timepoints using the identical hyphenated \"N-unit\" shape a genuine duration uses (\"2-year OS\", \"12-week landmark analysis including 323 patients\", \"6-month PFS rate was 52.9%\"); a population/cohort word (\"study\"/\"cohort\"/\"population\"/\"group\"/\"arm\"/\"participant\"/\"patient\") bridging past an unrelated number in the same clause (\"the median PFS in the study population was 2.5 months\", \"the median age of the study population was 63 years\"); a measurement window anchored to a named event rather than describing how long something itself lasted (\"mortality within 90 days of treatment start\"); a context word matched mid-word inside an unrelated word (\"platinum retreatment\" containing the substring \"treatment\", caught by requiring a real word boundary immediately before every context-word check, not just after); and an age/eligibility threshold phrased with the otherwise-legitimate preposition \"over\" (\"patients ... over 60 years\", which also motivated excluding bare \"year\" units from the standalone lead-in-preposition match entirely -- a year-unit duration still matches, but only via the stricter context-word-adjacent checks, which the real corpus age false positive failed and every real corpus true positive, e.g. a \"3-year follow-up\", passed). The final pattern requires an explicit duration-context word (trial/study/period/treatment/follow-up/intervention/regimen/course/phase/pilot/program/protocol/duration) adjacent to the number-unit -- either a lead-in preposition immediately before it (over/for/during/lasted/administered for/continued for), or the context word itself immediately before or after the number (comma-tolerant after a hyphenated form, to admit real corpus phrasing like \"8-week, multicentre, double-blind, randomized, placebo-controlled trial\") -- plus a dedicated age guard (`age`/`aged` immediately before, or `-old`/`of age` immediately after, unconditionally disqualifying regardless of what other context surrounds it). Verified by re-running the pattern against the full corpus after each fix until every one of the (final) 29 matched sentences across all three corpora was manually confirmed to be a genuine study/intervention/follow-up duration statement, and every identified false-positive shape above was confirmed to no longer match via dedicated negative regression tests. `DraftEvidenceItem` (`evidence_items.py`) gains `duration`/`duration_extraction_rules_version`, both exposed via `to_dict()`, derived directly from each candidate's own `sentence_text` every time (claim-level, like `confidence_interval`, not paper-level like PICO -- a study duration, an intervention duration, and a follow-up duration are routinely different values within the same paper). `knowledge_engine/extraction/__init__.py` re-exports `extract_duration`/`DURATION_EXTRACTION_RULES_VERSION` alongside the existing `confidence_interval` exports. Confirmed `duration` is NOT added to `cli.py`'s `REQUIRED_EVIDENCE_FIELDS` -- that set's own missing-key check runs on every load of `evidence_records.jsonl` (`ke evidence-report`, `ke evidence-map-report`, promotion, ...), so adding a new *required* key would have broken validation for every one of the corpus's already-promoted evidence records; the same additive-optional-field precedent M74/`federated_discovery.ProviderObservation` established was followed. New `tests/test_duration.py` (9 positive-match cases across the confirmed corpus variants plus case/whitespace tolerance, and 11 explicit negative cases -- one per false-positive shape found above, each with a short docstring naming the real corpus sentence it mirrors) and 4 new cases in `tests/test_extraction_evidence_items.py` (claim-level not paper-broadcast, `duration` confirmed absent from `REQUIRED_EVIDENCE_FIELDS`, a record missing the key still validates cleanly). CHANGELOG.md gained an M75 entry. Verification: `poetry install`, `poetry run ruff format --check .` / `ruff check .` (whole repo) and `poetry run mypy knowledge_engine tests` (whole repo) are clean; the full `poetry run pytest` suite is clean except the same two pre-existing, unrelated failures documented across many prior sessions (`test_evidence_map_report.py::test_cli_refuses_invalid_map_and_existing_output`, `test_statistical_verification.py::test_cli_rejects_invalid_input_and_protects_outputs` -- Typer/Click output-format mismatch, unrelated to this change). The opened PR's own fresh CI is still the actual merge gate; do not merge on the strength of this local run alone.

    Follow-up (same 2026-09-04 session): `chatgpt-codex-connector[bot]` left one P1 finding on PR #476 -- `after`/`before`/`following` were not excluded as trailing-context filler, so a fixed measurement timepoint stated relative to an event (\"Blood pressure was measured 3 months after treatment\", \"Symptoms were assessed 6 weeks before the intervention\") bridged past the temporal-relative preposition to reach a genuine duration noun (\"treatment\"/\"intervention\") and was misclassified as a duration -- the same false-positive category the module already excluded for anchor-event words, just reached from the other side. Verified real, fixed (`after`/`before`/`following` added to `_NON_DURATION_FILLER_WORD`), and pushed as a new commit (fc4862d) to the same PR #476 branch -- but PR #476's auto-merge had already completed at the pre-fix commit (95e1644d) by the time the fix landed, a race between this session's fix-and-push and the repository's CI-triggered auto-merge; `main` briefly carried the known bug. Opened PR #478 (same branch, same fix commit, now targeting `main` directly since #476 was already closed) to correct it. Re-ran extraction against all three corpora: matches dropped from ~27 to 22 (5 removed, all the after/before/following-bridging false positives; every remaining match spot-checked as genuine). 3 new regression tests. Re-verified: ruff format/check, mypy, full pytest suite clean (same two pre-existing unrelated failures only). Do not merge PR #478 in a future run without independently verifying its own fresh CI is green. Worth flagging for a human decision separately: this session observed that a PR with auto-merge enabled can merge at a stale head if a fix is pushed while its original commit's CI is still finishing -- a systemic race, not specific to this PR, that repeated per-repo across this portfolio's auto-merge setup could silently ship a known-bad fix in the same way here. See `human_decision_required` below."
  latest_summary_2026_09_04_seventh_session: "This hourly run's own light triage found zero open PRs across all three Knowledge Engine repositories (issue #433 item 3's PR #467 had already merged; see verified_repository_state above). Per AGENTS.md's standing directive to prefer work that directly enables the Research Report v1 structured-evidence contract over other backend work while that milestone is unmet, and since #433's own two remaining pieces (item 2's cache/reuse-hit flag, item 4's cross-provider concurrent scheduling) are both flagged in this file's own prior next_continuation note as separate, larger design decisions rather than small bounded slices, this session picked issue #449 instead: 'Research Report v1 support: structured evidence needed for report-level auditability.' Auditing #449's required-field list (population/exposure/dose/duration/comparator/outcome, measurement method, effect size, confidence interval, ...) against the actual M17-M28 deterministic extraction schema (`knowledge_engine/extraction/evidence_items.py`'s `DraftEvidenceItem`, `cli.py`'s `REQUIRED_EVIDENCE_FIELDS`) found population/intervention/comparator/outcome, study_type, and limitations already covered by M28/M26, but no field anywhere captured dose, duration, measurement_method, effect_size, or confidence_interval as structured data -- `claims.py`'s existing `confidence_interval` `matched_signal` only ever picked which candidate sentence to keep, never surfaced the CI itself as a field. This session closed the smallest well-scoped piece of that gap: new `knowledge_engine/extraction/confidence_interval.py` (`extract_confidence_interval`, `CONFIDENCE_INTERVAL_EXTRACTION_RULES_VERSION = \"m74-confidence-interval-v1\"`) matches a 95%/99% CI mention in one claim candidate's own sentence text and returns that sentence unchanged (never parsed lower/upper numeric bounds -- real papers state a CI in too many different shapes, alongside too many different effect-measure abbreviations and units, for mechanical parsing to stay honest, matching this project's 'quote, never parse or paraphrase' precedent from `extract_pico`). Unlike PICO's population/intervention/comparator/outcome, a confidence interval is a claim-level fact (two results in the same paper can carry two different intervals), so `build_draft_evidence_item` (`evidence_items.py`) derives it directly from each candidate's own `sentence_text` every time, rather than a paper-level value threaded in as a parameter and broadcast across every candidate the way PICO fields are. `DraftEvidenceItem` gains `confidence_interval`/`confidence_interval_extraction_rules_version`, both exposed via `to_dict()`; both are deliberately kept OUT of `cli.py`'s `REQUIRED_EVIDENCE_FIELDS` -- that set's own missing-key check runs every time `evidence_records.jsonl` is loaded (`ke evidence-report`, `ke evidence-map-report`, promotion, ...), so adding a new *required* key would have broken validation for every one of the corpus's 953 already-promoted evidence records; the additive-optional-field precedent already established by `federated_discovery.ProviderObservation`'s `corrected`/`expression_of_concern`/`withdrawn` fields was followed instead. No caller outside `evidence_items.py` needed a signature change: `extraction_review_batch.py`, `general_question_extraction_promotion.py` (the GQR extraction/promotion path), and both the production `ke` and `ke-research` slim single-paper/batch commands all already funnel through `build_draft_evidence_item`/`build_draft_evidence_items`, so every extraction path gets this uniformly. New tests: `tests/test_confidence_interval.py` (95%/99% CI match, case/whitespace tolerance, no false-positive on a bare percentage, no match on a CI-free sentence) and three new cases plus one backward-compatibility regression case in `tests/test_extraction_evidence_items.py` (claim-level, not paper-broadcast; `confidence_interval` confirmed absent from `REQUIRED_EVIDENCE_FIELDS` and a record missing the key still validates cleanly, i.e. an evidence record promoted before this session's change is not retroactively broken). CHANGELOG.md gained an M74 entry naming `dose`/`duration`/`measurement_method`/`effect_size` as the explicitly unaddressed remaining follow-up slices of #449's structured-field list. Verification: `poetry install`, `poetry run ruff format --check .` / `ruff check .` and `poetry run mypy knowledge_engine/extraction/confidence_interval.py knowledge_engine/extraction/evidence_items.py knowledge_engine/extraction/__init__.py` are clean; the full `poetry run pytest` suite is clean except the same two pre-existing, unrelated failures documented across many prior sessions (`test_evidence_map_report.py::test_cli_refuses_invalid_map_and_existing_output`, `test_statistical_verification.py::test_cli_rejects_invalid_input_and_protects_outputs` -- Typer/Click output-format mismatch, unrelated to this change). The opened PR's own fresh CI is still the actual merge gate; do not merge on the strength of this local run alone.

