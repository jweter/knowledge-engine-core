active_work:
  name: "Research-loop bottleneck instrumentation (issue #433) -- extraction/promotion timing slice"
  tracking_issue: "#433 (jweter/knowledge-engine-core), companion to jweter/knowledge-engine-ai#84, refs #402"
  state: "one slice implemented this session, PR opened, awaiting fresh CI"
  summary: "2026-08-31 (hourly run): #433 asks for per-operation duration_ms with substage timing across six named Core bottlenecks, none of which existed anywhere in the repo before this session (grepped for duration_ms first). Item 5, 'grounded extraction/promotion', is the issue's own named largest bottleneck, so this session instrumented it: GeneralQuestionExtractionPromotionSummary (knowledge_engine/general_question_extraction_promotion.py) gained duration_ms (total call time), extraction_duration_ms (run_batch_extraction_review substage), and promotion_duration_ms (_promote_evidence_records substage, 0 when nothing reached promotion). Both CLI surfaces (entrypoint.py's ke general-question-extract-and-promote, research_review_surface.py's ke-research-slim twin) print all three. Purely additive dataclass fields; the one existing construction site is updated, no other caller constructs this dataclass. New/updated tests: unit-level duration_ms/extraction_duration_ms/promotion_duration_ms >= 0 assertions plus a promotion_duration_ms == 0 assertion on the no-claim-candidates rejection path (tests/test_general_question_extraction_promotion.py); both CLI round-trip tests assert the new fields appear in printed output (tests/test_general_question_extract_and_promote_cli.py). Full local gate (ruff format --check, ruff check, mypy) clean on touched files and repo-wide; full pytest run in progress at time of writing, targeted tests (9 cases across both files) green.
    Not done in this slice -- explicitly follow-up work per #433: (1) CLI/process startup-vs-work timing, (2) federated-provider per-attempt latency/degradation in the ledger, (3) full discovered->deduplicated->already_indexed->eligible->acquired candidate-funnel persistence (GeneralQuestionAcquisitionPlan already exposes most of these as counts today, just not durably persisted alongside duration), (4) bounded-concurrency acquisition throughput, (6) a re-retrieval-readiness signal. Pick the next of these for the following #433 slice rather than re-touching extraction/promotion timing."

next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "Continue issue #433 (research-loop bottleneck instrumentation) with the next unaddressed substage listed in active_work.summary above -- the federated-provider per-attempt latency/degradation metadata (item 2) or the candidate-funnel persistence (item 3) are the next-smallest coherent slices. Verify this session's PR's CI is green and merge it first if not already merged. If #433 is later fully addressed on Core's side, re-read docs/roadmap.md's 'Current Project Path' section fresh for the next P5 slice."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md."

