name: Security - Bandit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bandit:
    name: Python security scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check bandit

      - name: Report full Bandit baseline
        continue-on-error: true
        run: bandit --recursive knowledge_engine

      - name: Block high-severity findings
        run: bandit --recursive --severity-level high knowledge_engine
