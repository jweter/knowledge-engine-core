name: GQR Unpaywall P1 repair

on:
  push:
    branches:
      - agent/gqr-unpaywall-execution

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/gqr-unpaywall-execution
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply review-driven repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('knowledge_engine/general_question_unpaywall_acquisition.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '    AcquisitionDisposition,\n    AcquisitionPlanItem,\n',
              '    AcquisitionDisposition,\n    AcquisitionIdentity,\n    AcquisitionPlanItem,\n',
              1,
          )
          text = text.replace(
              'from knowledge_engine.models import ImportItem, ImportRun, ManifestSnapshot\n',
              'from knowledge_engine.models import ImportItem, ImportRun, ManifestSnapshot, Paper\n',
              1,
          )

          old_receipt_fields = '''class GeneralQuestionUnpaywallPersistenceReceiptItem:\n    candidate_id: str\n    doi: str\n    pdf_url: str\n    source_host: str\n    filename: str\n    sha256: str\n    paper_id: int\n    persistence_status: str\n    import_item_id: str | None = None\n'''
          new_receipt_fields = '''class GeneralQuestionUnpaywallPersistenceReceiptItem:\n    candidate_id: str\n    doi: str\n    pdf_url: str\n    source_host: str\n    plan_license: str\n    resolved_license: str\n    filename: str\n    byte_count: int\n    sha256: str\n    paper_id: int\n    persistence_status: str\n    import_item_id: str | None = None\n'''
          if old_receipt_fields not in text:
              raise SystemExit('persistence receipt field block not found')
          text = text.replace(old_receipt_fields, new_receipt_fields, 1)

          old_existing = '''            parsed = document_parser.parse(paper_path)\n            existing = (\n                repository.paper_by_content_hash(parsed.content_hash)\n                or repository.paper_by_normalized_doi(identity.doi)\n                or repository.paper_by_pmid(identity.pmid)\n                or repository.paper_by_arxiv_id(identity.arxiv_id)\n            )\n'''
          new_existing = '''            parsed = document_parser.parse(paper_path)\n            existing = _reconciled_existing_paper(\n                repository,\n                content_hash=parsed.content_hash,\n                identity=identity,\n            )\n'''
          if old_existing not in text:
              raise SystemExit('existing-paper block not found')
          text = text.replace(old_existing, new_existing, 1)

          old_persist_item = '''                    pdf_url=receipt_item.pdf_url,\n                    source_host=receipt_item.source_host,\n                    filename=receipt_item.filename,\n                    sha256=receipt_item.sha256,\n'''
          new_persist_item = '''                    pdf_url=receipt_item.pdf_url,\n                    source_host=receipt_item.source_host,\n                    plan_license=receipt_item.plan_license,\n                    resolved_license=receipt_item.resolved_license,\n                    filename=receipt_item.filename,\n                    byte_count=receipt_item.byte_count,\n                    sha256=receipt_item.sha256,\n'''
          if old_persist_item not in text:
              raise SystemExit('persistence item construction not found')
          text = text.replace(old_persist_item, new_persist_item, 1)

          old_linked = '''            pdf_url=item.pdf_url,\n            source_host=item.source_host,\n            filename=item.filename,\n            sha256=item.sha256,\n'''
          new_linked = '''            pdf_url=item.pdf_url,\n            source_host=item.source_host,\n            plan_license=item.plan_license,\n            resolved_license=item.resolved_license,\n            filename=item.filename,\n            byte_count=item.byte_count,\n            sha256=item.sha256,\n'''
          if old_linked not in text:
              raise SystemExit('linked receipt construction not found')
          text = text.replace(old_linked, new_linked, 1)

          helper_anchor = '\n\ndef _record_unpaywall_import_run(\n'
          helper = '''\n\ndef _reconciled_existing_paper(\n    repository: DuplicateQueryRepository,\n    *,\n    content_hash: str,\n    identity: AcquisitionIdentity,\n) -> Paper | None:\n    """Reuse a Paper only when content and every stable identity signal agree."""\n\n    content_match = repository.paper_by_content_hash(content_hash)\n    identity_matches = tuple(\n        paper\n        for paper in (\n            repository.paper_by_normalized_doi(identity.doi) if identity.doi else None,\n            repository.paper_by_pmid(identity.pmid) if identity.pmid else None,\n            repository.paper_by_arxiv_id(identity.arxiv_id) if identity.arxiv_id else None,\n        )\n        if paper is not None\n    )\n    identity_by_id = {paper.id: paper for paper in identity_matches}\n    if len(identity_by_id) > 1:\n        raise GeneralQuestionUnpaywallAcquisitionError(\n            "Stable identity signals resolve to different Papers; refusing automatic reuse."\n        )\n\n    identity_match = next(iter(identity_by_id.values()), None)\n    if (\n        content_match is not None\n        and identity_match is not None\n        and content_match.id != identity_match.id\n    ):\n        raise GeneralQuestionUnpaywallAcquisitionError(\n            "Acquired content and stable identity resolve to different Papers; "\n            "refusing automatic reuse."\n        )\n    if identity_match is not None and identity_match.content_hash != content_hash:\n        raise GeneralQuestionUnpaywallAcquisitionError(\n            "Stable identity matches a Paper whose content hash differs from acquired content; "\n            "refusing automatic reuse."\n        )\n    return content_match or identity_match\n'''
          if helper_anchor not in text:
              raise SystemExit('helper insertion anchor not found')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old_evidence = '''            "pdf_url": persisted.pdf_url,\n            "source_host": persisted.source_host,\n            "persistence_status": persisted.persistence_status,\n            "matched_paper_id": persisted.paper_id,\n'''
          new_evidence = '''            "pdf_url": persisted.pdf_url,\n            "source_host": persisted.source_host,\n            "plan_license": persisted.plan_license,\n            "resolved_license": persisted.resolved_license,\n            "byte_count": persisted.byte_count,\n            "persistence_status": persisted.persistence_status,\n            "matched_paper_id": persisted.paper_id,\n'''
          if old_evidence not in text:
              raise SystemExit('duplicate-evidence block not found')
          text = text.replace(old_evidence, new_evidence, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_unpaywall_gqr_acquisition.py')
          tests = test_path.read_text(encoding='utf-8')
          receipt_anchor = '    assert result.items[0].import_item_id is not None\n'
          receipt_assertions = '''    assert result.items[0].import_item_id is not None\n    assert result.items[0].plan_license == "CC BY"\n    assert result.items[0].resolved_license == "CC BY"\n    assert result.items[0].byte_count == execution.receipt.items[0].byte_count\n'''
          if receipt_anchor not in tests:
              raise SystemExit('receipt assertion anchor not found')
          tests = tests.replace(receipt_anchor, receipt_assertions, 1)

          marker = 'def test_persistence_rejects_conflicting_content_and_stable_identity'
          if marker not in tests:
              tests += '''\n\ndef test_persistence_rejects_conflicting_content_and_stable_identity(tmp_path: Path) -> None:\n    database = _database(tmp_path)\n    papers_dir = tmp_path / "papers-conflict"\n    execution = execute_unpaywall_acquisition_plan(\n        _plan(),\n        resolver=FakeResolver(_resolved()),\n        acquisition_service=FakeAcquisitionService(),\n        output_directory=papers_dir,\n    )\n    acquired_hash = execution.receipt.items[0].sha256\n\n    with database.session() as session:\n        session.add(\n            Paper(\n                title="Same bytes under another identity",\n                doi="10.1000/other",\n                source_path="other.pdf",\n                content_hash=acquired_hash,\n                publication_year=2025,\n                page_count=1,\n                word_count=1,\n            )\n        )\n        session.add(\n            Paper(\n                title="Planned DOI with conflicting bytes",\n                doi="10.1000/creatine",\n                source_path="conflicting.pdf",\n                content_hash="f" * 64,\n                publication_year=2025,\n                page_count=1,\n                word_count=1,\n            )\n        )\n\n    with (\n        pytest.raises(GeneralQuestionUnpaywallAcquisitionError, match="different Papers"),\n        database.session() as session,\n    ):\n        persist_unpaywall_acquisition_execution(\n            session,\n            _plan(),\n            execution,\n            output_directory=papers_dir,\n            parser=FakeParser(),\n        )\n\n    with database.session() as session:\n        assert len(session.scalars(select(Paper)).all()) == 2\n        assert session.scalar(select(ImportRun)) is None\n'''
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Install Poetry and project
        shell: bash
        run: |
          python -m pip install poetry
          poetry install

      - name: Format and validate repaired files
        shell: bash
        run: |
          poetry run ruff format knowledge_engine/general_question_unpaywall_acquisition.py tests/test_unpaywall_gqr_acquisition.py
          poetry run ruff check knowledge_engine/general_question_unpaywall_acquisition.py tests/test_unpaywall_gqr_acquisition.py
          poetry run mypy knowledge_engine/general_question_unpaywall_acquisition.py
          poetry run pytest -q \
            tests/test_unpaywall_gqr_acquisition.py \
            tests/test_unpaywall_lookup.py \
            tests/test_unpaywall_lookup_cli.py \
            tests/test_manual_pdf_preview.py

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/gqr-unpaywall-p1-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Unpaywall GQR provenance review findings'
          git push origin HEAD:agent/gqr-unpaywall-execution
