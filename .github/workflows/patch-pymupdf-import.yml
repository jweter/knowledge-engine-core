name: Patch PyMuPDF import path

on:
  push:
    branches:
      - agent/pymupdf-json-stdout-clean
    paths:
      - .github/workflows/patch-pymupdf-import.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/pymupdf-json-stdout-clean
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            knowledge_engine/parser.py
            tests/test_machine_json_stdout.py
      - name: Use supported PyMuPDF import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('knowledge_engine/parser.py')
          text = path.read_text(encoding='utf-8')
          old = 'import fitz\n'
          new = 'import pymupdf as fitz\n'
          if old not in text:
              raise SystemExit('legacy fitz import not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge_engine/parser.py
          git commit -m "Use supported silent PyMuPDF import"
          git push origin HEAD:agent/pymupdf-json-stdout-clean
