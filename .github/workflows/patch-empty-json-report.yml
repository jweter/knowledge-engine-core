name: Patch empty JSON evidence report

on:
  push:
    branches:
      - agent/evidence-report-empty-json
    paths:
      - .github/workflows/patch-empty-json-report.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/evidence-report-empty-json
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            knowledge_engine/cli.py
            tests/test_cli.py
            docs/core_interface_contract.md
            tools/patch_empty_json_report.py

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply patch
        run: |
          python tools/patch_empty_json_report.py
          python -m pip install ruff==0.16.3
          ruff format knowledge_engine/cli.py tests/test_cli.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge_engine/cli.py tests/test_cli.py docs/core_interface_contract.md
          git commit -m "Return empty JSON evidence report on indexed miss"
          git push origin HEAD:agent/evidence-report-empty-json
