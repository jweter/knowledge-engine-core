name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Python quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: poetry run ruff format --check --diff . > ruff-format.diff

      - name: Upload formatting diff
        if: steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ruff-format-diff
          path: ruff-format.diff

      - name: Enforce formatting result
        if: steps.formatting.outcome == 'failure'
        run: |
          cat ruff-format.diff
          exit 1

      - name: Lint
        id: ruff
        continue-on-error: true
        run: |
          set -o pipefail
          poetry run ruff check . 2>&1 | tee ruff.log

      - name: Upload lint diagnostics
        if: steps.ruff.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ruff-diagnostics
          path: ruff.log

      - name: Enforce lint result
        if: steps.ruff.outcome == 'failure'
        run: |
          cat ruff.log
          exit 1

      - name: Type check
        id: mypy
        continue-on-error: true
        run: |
          set -o pipefail
          poetry run mypy knowledge_engine tests 2>&1 | tee mypy.log

      - name: Upload mypy diagnostics
        if: steps.mypy.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: mypy-diagnostics
          path: mypy.log

      - name: Enforce mypy result
        if: steps.mypy.outcome == 'failure'
        run: |
          cat mypy.log
          exit 1

      - name: Test
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          poetry run pytest 2>&1 | tee pytest.log

      - name: Upload pytest diagnostics
        if: steps.pytest.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: pytest-diagnostics
          path: pytest.log

      - name: Enforce pytest result
        if: steps.pytest.outcome == 'failure'
        run: |
          cat pytest.log
          exit 1

      - name: Check diff hygiene
        run: git diff --check

      - name: Reject temporary delivery artifacts
        run: |
          test ! -e .github/scripts/apply_review_status.py
          test ! -e .github/scripts/normalize_review_status_guards.py
          test ! -e .github/scripts/fix_review_status_tests.py
          test ! -e review-status-delivery.txt
          test ! -e pytest-review-status.txt
          test ! -e review-status-error.txt

  slim-research-runtime:
    name: Slim Research runtime install
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Render lean dependency set
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/render-research-runtime-requirements.py \
            > "${RUNNER_TEMP}/research-runtime-requirements.txt"
          cat "${RUNNER_TEMP}/research-runtime-requirements.txt"

      - name: Install isolated slim runtime
        run: |
          python -m venv "${RUNNER_TEMP}/ke-research-venv"
          "${RUNNER_TEMP}/ke-research-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/ke-research-venv/bin/python" -m pip install \
            -r "${RUNNER_TEMP}/research-runtime-requirements.txt"
          "${RUNNER_TEMP}/ke-research-venv/bin/python" -m pip install --no-deps .

      - name: Prove vector stack is absent
        run: |
          "${RUNNER_TEMP}/ke-research-venv/bin/python" - <<'PY'
          import importlib.util

          forbidden = ("faiss", "qdrant_client", "sentence_transformers", "torch")
          present = [name for name in forbidden if importlib.util.find_spec(name) is not None]
          assert not present, f"vector-only packages leaked into slim runtime: {present}"
          print("SLIM_VECTOR_STACK_ABSENT=1")
          PY

      - name: Verify complete Research command surface
        run: |
          RESEARCH_VENV="${RUNNER_TEMP}/ke-research-venv"
          "$RESEARCH_VENV/bin/ke-research" research-runtime-capabilities \
            > "${RUNNER_TEMP}/research-runtime-capabilities.json"
          "$RESEARCH_VENV/bin/python" - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          payload = json.loads((root / "research-runtime-capabilities.json").read_text())
          assert payload["complete"] is True, payload
          assert payload["missing_commands"] == [], payload
          executable = root / "ke-research-venv" / "bin" / "ke-research"
          for command in payload["required_commands"]:
              subprocess.run(
                  [str(executable), command, "--help"],
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True,
              )
          print(f"SLIM_RESEARCH_COMMAND_COUNT={len(payload['required_commands'])}")
          PY
