name: Temporary - Regenerate Poetry Lock

on:
  push:
    branches:
      - copilot/fix-with-copilot-yet-again

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: copilot/fix-with-copilot-yet-again

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.4.1

      - name: Regenerate lockfile
        run: poetry lock

      - name: Commit regenerated lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- poetry.lock; then
            echo "poetry.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          git commit -m "chore: regenerate Poetry lockfile"
          git push origin HEAD:copilot/fix-with-copilot-yet-again
