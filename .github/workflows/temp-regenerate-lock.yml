name: Temporary - Regenerate Poetry Lock

on:
  push:
    branches:
      - copilot/fix-with-copilot-yet-again

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.4.1

      - name: Regenerate lockfile
        run: poetry lock

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-poetry-lock
          path: poetry.lock
          if-no-files-found: error
