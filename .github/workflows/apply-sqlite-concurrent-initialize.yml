name: Apply concurrent SQLite initialization fix

on:
  push:
    branches:
      - agent/sqlite-concurrent-initialize
    paths:
      - .github/workflows/apply-sqlite-concurrent-initialize.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sqlite-concurrent-initialize

      - name: Apply SQLite busy-timeout fix and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('knowledge_engine/database.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'CURRENT_SCHEMA_VERSION = 14\n',
              'CURRENT_SCHEMA_VERSION = 14\n_SQLITE_BUSY_TIMEOUT_MS = 30_000\n',
              1,
          )
          old = '''    cursor = dbapi_connection.cursor()\n    cursor.execute("PRAGMA foreign_keys=ON")\n    cursor.close()\n'''
          new = '''    cursor = dbapi_connection.cursor()\n    cursor.execute("PRAGMA foreign_keys=ON")\n    # Parallel read-oriented CLI calls can start against the same fresh local\n    # database and both run schema initialization. SQLite allows only one writer\n    # at a time, so wait for that bounded startup lock instead of failing one\n    # research branch with ``database is locked``.\n    cursor.execute(f"PRAGMA busy_timeout={_SQLITE_BUSY_TIMEOUT_MS}")\n    cursor.close()\n'''
          if old not in text:
              raise SystemExit('database connection block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_database_concurrency.py')
          test.write_text('''from __future__ import annotations\n\nimport sqlite3\nimport time\nfrom concurrent.futures import ThreadPoolExecutor\nfrom pathlib import Path\n\nfrom knowledge_engine.config import Settings\nfrom knowledge_engine.database import Database\n\n\ndef _database(tmp_path: Path) -> tuple[Database, Path]:\n    database_path = tmp_path / "knowledge-engine.sqlite3"\n    settings = Settings(\n        project_root=tmp_path,\n        data_dir=tmp_path / "data",\n        database_url=f"sqlite:///{database_path}",\n    )\n    return Database(settings), database_path\n\n\ndef test_sqlite_connections_use_bounded_busy_timeout(tmp_path: Path) -> None:\n    database, _ = _database(tmp_path)\n    with database.engine.connect() as connection:\n        busy_timeout = connection.exec_driver_sql("PRAGMA busy_timeout").scalar_one()\n\n    assert busy_timeout == 30_000\n\n\ndef test_initialize_waits_for_transient_parallel_writer(tmp_path: Path) -> None:\n    first, database_path = _database(tmp_path)\n    first.initialize()\n    second, _ = _database(tmp_path)\n\n    blocker = sqlite3.connect(database_path, isolation_level=None)\n    blocker.execute("BEGIN EXCLUSIVE")\n    try:\n        with ThreadPoolExecutor(max_workers=1) as executor:\n            future = executor.submit(second.initialize)\n            time.sleep(0.2)\n            assert not future.done()\n            blocker.execute("COMMIT")\n            future.result(timeout=5)\n    finally:\n        if blocker.in_transaction:\n            blocker.execute("ROLLBACK")\n        blocker.close()\n''', encoding='utf-8')
          PY

      - name: Run focused checks
        run: |
          python -m pip install poetry
          poetry install
          poetry run ruff format --check knowledge_engine/database.py tests/test_database_concurrency.py
          poetry run ruff check knowledge_engine/database.py tests/test_database_concurrency.py
          poetry run pytest -q tests/test_database_concurrency.py

      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-sqlite-concurrent-initialize.yml
          git add knowledge_engine/database.py tests/test_database_concurrency.py
          git commit -m 'Wait for transient SQLite initialization locks'
          git push origin HEAD:agent/sqlite-concurrent-initialize
