name: Security - pip-audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pip-audit:
    name: Python dependency vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install audit tooling
        run: python -m pip install --disable-pip-version-check poetry pip-audit

      - name: Install locked runtime dependencies
        run: poetry install --only main --no-root

      - name: Snapshot installed runtime dependencies
        run: poetry run python -m pip freeze --all > /tmp/requirements-audit.txt

      - name: Audit locked runtime dependencies
        run: pip-audit --requirement /tmp/requirements-audit.txt --no-deps --disable-pip
